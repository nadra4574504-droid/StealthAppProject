name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - name: Inject Secrets
      run: |
        sed -i 's|PLACEHOLDER_BOT_TOKEN|${{ secrets.DEVICE_BOT_TOKEN }}|g' app/src/main/java/com/stealth/app/BotService.java
        sed -i 's|PLACEHOLDER_ADMIN|${{ secrets.ADMIN_ID }}|g' app/src/main/java/com/stealth/app/BotService.java
        sed -i 's|PLACEHOLDER_GITHUB_TOKEN|${{ secrets.GH_PAT }}|g' app/src/main/java/com/stealth/app/BotService.java
    - run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH
    - run: gradle assembleDebug --no-daemon
    - uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        files: app/build/outputs/apk/debug/app-debug.apk